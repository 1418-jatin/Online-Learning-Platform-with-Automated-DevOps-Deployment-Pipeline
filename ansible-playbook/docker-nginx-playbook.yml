---
- name: Install Docker and Nginx on the application servers
  hosts: application-servers
  become: yes
  vars:
    app_port: 5000     # port where the application container listens on the server

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker and Nginx
      ansible.builtin.apt:
        name:
          - docker.io
          - nginx
        state: present

    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker log rotation
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: '0644'
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" }
          }
      notify: Restart docker

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Allow the ubuntu user to run docker without sudo
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Remove the default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Configure Nginx as a reverse proxy to the application container
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/olp.conf
        mode: '0644'
        content: |
          server {
              listen 80 default_server;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Validate the Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

    - name: Check the Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Show the Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
