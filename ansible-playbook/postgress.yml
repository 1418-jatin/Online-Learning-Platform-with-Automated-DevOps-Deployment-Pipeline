---
- name: Install and configure PostgreSQL on the database server
  hosts: db-server
  become: yes
  vars:
    db_name: olp_db
    db_user: olp_user
    db_password: "ChangeMe_Str0ngPass"     # change this
    db_allowed_cidrs:
      - 10.0.0.0/16                        # PRT-VPC (the application servers)

  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - acl                            # needed to run commands as the postgres user
        state: present
        update_cache: yes

    - name: Enable and start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes

    - name: Find the installed PostgreSQL version
      ansible.builtin.find:
        paths: /etc/postgresql
        file_type: directory
        recurse: no
      register: pg_dirs

    - name: Set the PostgreSQL config directory
      ansible.builtin.set_fact:
        pg_conf_dir: "{{ (pg_dirs.files | sort(attribute='path') | last).path }}/main"

    - name: Listen on all network interfaces
      ansible.builtin.copy:
        dest: "{{ pg_conf_dir }}/conf.d/olp.conf"
        owner: postgres
        group: postgres
        mode: '0644'
        content: |
          listen_addresses = '*'
      notify: Restart postgresql

    - name: Allow the application servers to log in (pg_hba.conf)
      ansible.builtin.blockinfile:
        path: "{{ pg_conf_dir }}/pg_hba.conf"
        marker: "# {mark} ANSIBLE MANAGED - online learning platform"
        block: |
          {% for cidr in db_allowed_cidrs %}
          host    {{ db_name }}    {{ db_user }}    {{ cidr }}    scram-sha-256
          {% endfor %}
      notify: Restart postgresql

    - name: Apply the configuration changes now
      ansible.builtin.meta: flush_handlers

    - name: Check whether the database user exists
      ansible.builtin.command:
        argv: [psql, -tAc, "SELECT 1 FROM pg_roles WHERE rolname='{{ db_user }}'"]
      become_user: postgres
      register: user_exists
      changed_when: false

    - name: Create the database user
      ansible.builtin.command:
        argv: [psql, -c, "CREATE USER {{ db_user }} WITH PASSWORD '{{ db_password }}'"]
      become_user: postgres
      when: user_exists.stdout.strip() != '1'
      no_log: true

    - name: Check whether the database exists
      ansible.builtin.command:
        argv: [psql, -tAc, "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'"]
      become_user: postgres
      register: db_exists
      changed_when: false

    - name: Create the database
      ansible.builtin.command:
        argv: [psql, -c, "CREATE DATABASE {{ db_name }} OWNER {{ db_user }}"]
      become_user: postgres
      when: db_exists.stdout.strip() != '1'

    - name: Check that PostgreSQL is listening
      ansible.builtin.shell: ss -ltn | grep ':5432'
      register: listening
      changed_when: false

    - name: Show listening sockets
      ansible.builtin.debug:
        var: listening.stdout_lines

  handlers:
    - name: Restart postgresql
      ansible.builtin.service:
        name: postgresql
        state: restarted
